; floors 2 and 3 until the next tuning pass.
+TrapPools=(FloorNumber=2,FloorRole="Mob",TrapPool=("ObstacleSweeperArm","ObstacleFloorBumper","ObstacleWallBumper","ObstacleCeilingHammer"))
+TrapPools=(FloorNumber=3,FloorRole="Mob",TrapPool=("ObstacleSweeperArm","ObstacleFloorBumper","ObstacleWallBumper","ObstacleCeilingHammer"))
+TrapPools=(FloorNumber=4,FloorRole="Mob",TrapPool=())
