; Tower/world tuning for tower floor and room generation.
; This is a typed runtime owner. The human-facing tuning surface points here;
; gameplay code should not grow a one-file mega tuning object.

[/Script/T66.T66TowerTuningConfig]
RoofSkinThickness=12.0
StartFloorHeadroom=2000.0
StandardFloorHeadroom=1200.0
PlacementCellSize=1000.0
DungeonKitWallDepth=120.0
GeneratedDungeonKitWallHeight=1200.0
GeneratedDungeonKitFloorThickness=24.0
GeneratedDungeonKitCullDistance=30000
ShellRadius=20000.0
StartRoomSquareSize=6500.0
GridColumns=70
GridRows=70
GridCellSize=1000.0
GridDoorWidth=1000.0
; Room courses (design ref section 1.7): rooms shrink to ONE camera view
; ("miniature Fall Guys map") and the count rises to compensate.
DungeonMinRooms=13
DungeonMaxRooms=16
DungeonMinRoomTiles=6
DungeonMaxRoomTiles=10
; Short halls (2026-06-10): a new room must land within this edge gap (cells) of the
; existing cluster, so corridors are born short. Old scatter maximized spread.
RoomMaxGapCells=6
; Arrival (drop landing) room — was 3-4 and read cramped; gate ceremony breathes.
StartRoomMinTiles=6
StartRoomMaxTiles=8
GridBranchChance=0.35
GridMaxBranchCells=3

; Parity default: current code builds a 4-floor normal tower. The map design doc
; describes the future 5-floor contract; change these values only as a tuning pass.
StartFloorNumber=1
FirstMobFloorNumber=2
LastMobFloorNumber=3
BossFloorNumber=4
BossRushBossFloorNumber=2

TowerChestCountPerFloor=(Min=1,Max=3)
TowerCrateCountPerFloor=(Min=1,Max=3)
TowerFountainChancePerFloor=0.40

; Bouncy obstacle-course platforms on gameplay floors. Tier heights and the chain
; gap are clamped in code against hero jump reach (JumpZ 1600 / gravity 4.5 ->
; ~290uu max step, ~420uu safe flat gap), so the arrival->exit Tier 2 chain stays
; single-jump traversable for every hero.
BounceCoursePlatforms=1
PlatformTier1Height=200.0
PlatformTier2Height=400.0
; 620 footprint in 1000 cells leaves ~190uu clear walk lanes on both corridor sides
; (the 700/350 first pass read as sealed corridors in the 2026-06-10 playtest).
ChainPlatformFootprint=620.0
RoomPlatformFootprintMin=550.0
RoomPlatformFootprintMax=750.0
RoomPlatformDensityTiles=8
PlatformChainMaxGap=380.0
; Elevated-deck architecture pass (design ref section 1.5): seeded share of
; non-chain platforms spawned as cylinders (Fall Guys pucks / round decks).
; Chain platforms stay rectangular (the dry-anchor gap proof measures box edges).
RoundPlatformChance=0.45
RampWidth=600.0
RampLength=520.0

; Tier terrain (accessibility infrastructure, 2026-06-10 second pass): per-room
; mesas at +500 (above jump reach -> ramps/lifts matter; above the lava cap ->
; dry at full flood) with 2-4 constructive ramps each; corridors stay ground.
; See T66_MAP_DESIGN_REFERENCE.md section 1.3 for the no-softlock contract.
TierTerrain=1
TierHeight=500.0
MesaInsetCells=2
MesaMinSpanCells=3
MesaRampsMin=2
MesaRampsMax=4
MesaTopBafflePitch=200.0
MesaTopBaffleDiameter=180.0
RampRollerDiameter=90.0
; Ring mesas (design ref section 1.6): a >=5x5 mesa deck rolls this chance to get
; a 1-2 cell center drop hole — falling through is a legal drop into the open
; under-deck ground (the deck architecture makes the pit escape built-in).
RingMesaChance=0.5

; Moving lift platforms (Phase 2 item 1): Fall Guys non-trap elevators cycling
; ground <-> mesa top. A mesa that gathered a SURPLUS ramp candidate beyond
; MesaRampsMin converts one into a lift at LiftChance, so static ramps never
; drop below the access minimum and the lift is a bonus route (it still counts
; as an up-edge in the no-softlock BFS). Clamps in code: footprint fits the
; grid cell with mesa clearance, rise speed <= ~400uu/s, dwell >= 0.75s.
; See T66_MAP_DESIGN_REFERENCE.md section 1.4 for the full contract.
TierLifts=1
LiftChance=0.5
LiftFootprint=600.0
LiftTravelSeconds=3.0
LiftDwellSeconds=2.0

; Rising-lava hazard on gameplay floors (bouncy preset). Lava rises only on the
; hero's current floor after the grace window, caps below Tier 2 platform tops,
; and deals damage-over-time while submerged instead of killing instantly.
; Requires every gameplay floor to pass the BounceCourseSummary chain validation;
; otherwise the legacy spreading coverage is used.
TowerLavaRise=1
LavaGraceSeconds=25.0
LavaRiseSeconds=150.0
LavaMaxHeight=320.0
LavaDamagePerTick=20

; Inflatable doorway arches (visual-only baffle tubes replacing the flat lintel).
DoorwayArches=1
ArchSegments=10
ArchTubeDiameter=110.0

DefaultRoomRuleID=DefaultCombat
StartRoomRuleID=Start
BossRoomRuleID=Boss
+RoomRules=(RuleID="Start",RoomRole="Start",WidthTiles=(Min=5,Max=5),HeightTiles=(Min=5,Max=5),HazardSlots=(Min=0,Max=0),RewardContentSlots=(Min=0,Max=0),Weight=1.0,LootBiasTag="None")
+RoomRules=(RuleID="DefaultCombat",RoomRole="Combat",WidthTiles=(Min=6,Max=10),HeightTiles=(Min=6,Max=10),HazardSlots=(Min=1,Max=2),RewardContentSlots=(Min=1,Max=2),Weight=1.0,LootBiasTag="Combat")
+RoomRules=(RuleID="Boss",RoomRole="Boss",WidthTiles=(Min=5,Max=5),HeightTiles=(Min=5,Max=5),HazardSlots=(Min=0,Max=0),RewardContentSlots=(Min=0,Max=0),Weight=1.0,LootBiasTag="Boss")

; Parity hazard pools. Floor 4 is explicit and empty so current obstacle scope stays
; floors 2 and 3 until the next tuning pass.
+HazardPools=(FloorNumber=2,FloorRole="Mob",HazardPool=("ObstacleSweeperArm","ObstacleFloorBumper","ObstacleWallBumper","ObstacleCeilingHammer"))
+HazardPools=(FloorNumber=3,FloorRole="Mob",HazardPool=("ObstacleSweeperArm","ObstacleFloorBumper","ObstacleWallBumper","ObstacleCeilingHammer"))
+HazardPools=(FloorNumber=4,FloorRole="Mob",HazardPool=())
