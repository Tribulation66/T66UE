StartRoomRuleID=Start
BossRoomRuleID=Boss
+RoomRules=(RuleID="Start",RoomRole="Start",WidthTiles=(Min=5,Max=5),HeightTiles=(Min=5,Max=5),TrapSlots=(Min=0,Max=0),NonTrapContentSlots=(Min=0,Max=0),Weight=1.0,LootBiasTag="None")
+RoomRules=(RuleID="DefaultCombat",RoomRole="Combat",WidthTiles=(Min=10,Max=20),HeightTiles=(Min=10,Max=20),TrapSlots=(Min=1,Max=2),NonTrapContentSlots=(Min=1,Max=1),Weight=1.0,LootBiasTag="Combat")
+RoomRules=(RuleID="Boss",RoomRole="Boss",WidthTiles=(Min=5,Max=5),HeightTiles=(Min=5,Max=5),TrapSlots=(Min=0,Max=0),NonTrapContentSlots=(Min=0,Max=0),Weight=1.0,LootBiasTag="Boss")

