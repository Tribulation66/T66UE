; Project overrides layered on top of Engine/Config/BaseScalability.ini.
; UE quality levels map to Low=0, Medium=1, High=2, Epic=3.
; Keep this file to ECVF_Scalability CVars only. Non-scalability renderer
; defaults belong in DefaultEngine.ini or DefaultDeviceProfiles.ini so cook
; does not hit ConfigUtilities ensures.

